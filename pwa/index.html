input,select,textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink);outline:none}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px #1b3f861c}input[type=checkbox]{width:auto;min-height:0;transform:scale(1.15);margin:5px 8px 5px 2px}label{display:block;margin:13px 0 5px;font-size:13px;font-weight:750;color:#374151}.req{color:var(--red)}.form-section{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:12px 0;background:#fbfcff}.form-section h4{margin:0 0 5px;color:var(--navy);font-size:14px}.form-section .section-help{font-size:11px;color:var(--muted);margin-bottom:8px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid .wide{grid-column:1/-1}

.project-card{display:flex;flex-direction:column;gap:10px}.project-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.project-name{font-size:16px;font-weight:800;color:var(--navy);line-height:1.4}.project-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.progress{height:7px;border-radius:999px;background:#edf0f5;overflow:hidden}.progress>i{display:block;height:100%;background:#1b3f86;border-radius:999px}.category-tile{border:1px solid var(--line);border-radius:13px;background:#fff;padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;min-height:78px}.category-tile:hover{border-color:#9eafd0;background:#fbfcff}.category-icon{width:42px;height:42px;border-radius:12px;background:#e8eefb;display:grid;place-items:center;font-size:20px;flex:none}.category-tile b{display:block;color:var(--navy);font-size:15px}.category-tile small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.filterbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(140px,190px));gap:9px;background:#fff;padding:13px;border:1px solid var(--line);border-radius:13px}.list{display:flex;flex-direction:column;gap:10px}.log-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px 16px;cursor:pointer}.log-card:hover{border-color:#b5c2d8}.log-title{font-weight:800;color:var(--navy);margin:5px 0}.log-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.check-row{display:flex;align-items:flex-start;gap:8px;padding:10px 2px;border-top:1px solid #eef0f4}.check-row .check-title{flex:1;cursor:pointer}.empty{padding:28px 14px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:13px}.overlay{display:none}

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="brand-mark">L</span><span>School Works<br><small style="font-size:11px;font-weight:500;color:#b9c7df">工作紀錄系統</small></span></div>
    <div class="nav-label">工作管理</div>
    <nav id="nav">
      <button data-v="dashboard"><i>▦</i>總覽</button>
      <button data-v="projects"><i>▣</i>總務／工程</button>

<script>
// ★ 填入 GAS /exec 網址（與之前相同即可）
const API_URL = 'https://script.google.com/macros/s/AKfycby05A2qYvYOsqPfFDDarLreBsoBtskympLc9tjwaF2LbH9as0SwC10KEzVoAt8j5BkX2w/exec';

const $ = s => document.querySelector(s);
const S = { view:'dashboard', projectId:null, meta:null, projects:[], logs:[], checklist:[], photos:[], onlyOpen:false,
            logsBy:{}, chkBy:{}, pk:new Map(), lk:new Map(),
            pf:{q:'',status:''}, lf:{q:'',type:'',project:'',category:''} };
const PAGE = 40;
const VIEW_TITLE = {dashboard:'總覽',projects:'總務／工程',project:'工程詳情',logbook:'工作紀錄',settings:'設定'};

/* ---------- 欄位定義（前端表單用；驗證以後端為準）---------- */
const PF = [
 {n:'Name',l:'工程名稱',t:'text',req:1,g:'基本資料',wide:1},
 {n:'Category',l:'工程類別',t:'text',g:'基本資料'},
 {n:'Location',l:'工程地點／位置',t:'text',g:'基本資料'},
 {n:'Scope',l:'工程範圍及工作內容',t:'area',g:'基本資料',wide:1},
 {n:'Status',l:'工程狀態',t:'select',en:'ProjectStatus',req:1,def:'尚未開始',g:'負責及進度'},
 {n:'Contractor',l:'承辦商／供應商',t:'text',g:'負責及進度'},
 {n:'Owner',l:'校內負責人',t:'text',g:'負責及進度'},
 {n:'StartDate',l:'開始日期',t:'date',g:'時間及預算'},
 {n:'PlannedEnd',l:'預計完成日期',t:'date',g:'時間及預算'},
 {n:'ActualEnd',l:'實際完成日期',t:'date',g:'時間及預算'},
 {n:'Budget',l:'預算（HK$）',t:'number',g:'時間及預算'},
 {n:'Remarks',l:'備註／特別安排',t:'area',g:'補充資料',wide:1}];
const WORK_CATEGORIES = ['總務','PE','班主任','其他'];
const LF = [
 {n:'WorkCategory',l:'工作範疇',t:'select',list:WORK_CATEGORIES,req:1,def:'總務'},
 {n:'ProjectID',l:'關聯工程（總務適用，可留空）',t:'project'},
 {n:'EventAt',l:'事件日期及時間',t:'datetime',req:1},
 {n:'Type',l:'紀錄類別',t:'select',en:'LogType',req:1},
 {n:'Title',l:'標題',t:'text',req:1},
 {n:'Content',l:'詳細內容',t:'area'},
 {n:'Parties',l:'相關人士或承辦商',t:'text'},
 {n:'Source',l:'事件來源',t:'text'},
 {n:'Result',l:'處理結果',t:'area'},
 {n:'NeedFollowUp',l:'需要跟進',t:'check'},
 {n:'AttachmentLinks',l:'附件連結（每行一個）',t:'area'}];
const CATS = ['A. 場地及時間安排','B. 清拆及前期準備','C. 水電煤及其他設施','D. 家俬及設備','E. 高空工作及特殊施工','F. 完工及驗收'];
const CF = [
 {n:'Title',l:'項目',t:'text',req:1},
 {n:'Category',l:'類別',t:'text',list:CATS},
 {n:'Required',l:'必須完成',t:'check'},
 {n:'Owner',l:'負責人',t:'text'},
 {n:'DueDate',l:'期限',t:'date'},
 {n:'Remarks',l:'備註',t:'area'}];

/* ---------- 小工具 ---------- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
function nowLocal(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function toast(msg, cls, ms){
  const t = $('#toast'); clearTimeout(toast.t);
  if (!msg) { t.style.display = 'none'; return; }
  t.textContent = msg; t.className = 'toast ' + (cls || 'info'); t.style.display = 'block';
  if (ms !== 0) toast.t = setTimeout(() => t.style.display = 'none', ms || 2500);
}
const getPw = () => sessionStorage.getItem('pw') || localStorage.getItem('pw') || '';
const clearPw = () => { sessionStorage.removeItem('pw'); localStorage.removeItem('pw'); };

/* ---------- API ---------- */
async function api(action, payload){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action, password:getPw()}, payload||{})),
      redirect:'follow', signal:ctl.signal });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '未知錯誤');
    return d.data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時，請檢查網絡後重試');
    if (e instanceof TypeError) throw new Error('網絡錯誤，無法連線伺服器');
    throw e;
  } finally { clearTimeout(timer); }
}

/* ---------- 本機資料庫（Map）＋快取＋增量同步 ---------- */
const TBL = {Projects:'projects', Logbook:'logs', Checklist:'checklist', Photos:'photos'};
const IDK = {Projects:'ProjectID', Logbook:'LogID', Checklist:'ItemID', Photos:'PhotoID'};
const D = {Projects:new Map(), Logbook:new Map(), Checklist:new Map(), Photos:new Map()};
let sinceTs = '', lastFull = 0, syncP = null, mutSeq = 0;

// 只有「記住此裝置」先會將資料存喺本機，避免共用電腦留低資料
const canPersist = () => !!localStorage.getItem('pw');
const idb = {
  db:null,
  open(){ return this.db || (this.db = new Promise((res,rej) => {
    const r = indexedDB.open('logbook',1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async get(k){ const db = await this.open();
    return new Promise((res,rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k,v){ const db = await this.open();
    return new Promise((res,rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async clear(){ const db = await this.open();
    return new Promise((res,rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').clear(); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};
let saveT;
function saveCache(){
  if (!canPersist()) return;
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const tables = {}; for (const t in D) tables[t] = [...D[t].values()];
    idb.set('data',{v:1, meta:S.meta, since:sinceTs, lastFull, tables}).catch(() => {});
  }, 300);
}
async function restoreCache(){
  if (!canPersist()) return false;
  const c = await idb.get('data');
  if (!c || c.v !== 1 || !c.meta || !c.since) return false;
  for (const t in D) D[t] = new Map((c.tables[t]||[]).map(r => [r[IDK[t]], r]));
  S.meta = c.meta; sinceTs = c.since; lastFull = c.lastFull || 0;
  rebuild(); return true;
}

function mergeRows(t, rows, force){
  let n = 0; const m = D[t], k = IDK[t];
  rows.forEach(r => {
    const id = r[k], old = m.get(id);
    if (r.IsDeleted === 'Y') { if (old) { m.delete(id); n++; } return; }
    if (old && !force && r.UpdatedAt < old.UpdatedAt) return;   // 唔用舊資料蓋過較新嘅本機資料
    if (!old || old.UpdatedAt !== r.UpdatedAt) n++;
    m.set(id, r);
  });
  return n;
}
// 由 Map 重建畫面用嘅陣列、索引同搜尋字串（只喺資料有變時做一次，唔使每次 render 都 filter/sort）
function rebuild(){
  const ps = D.Projects;
  S.projects = [...ps.values()].sort((a,b) => b.UpdatedAt.localeCompare(a.UpdatedAt));
  S.logs = [...D.Logbook.values()].filter(x => !x.ProjectID || ps.has(x.ProjectID)).sort((a,b) => b.EventAt.localeCompare(a.EventAt));
  S.checklist = [...D.Checklist.values()].filter(x => ps.has(x.ProjectID)).sort((a,b) => a.ItemID.localeCompare(b.ItemID));
  S.photos = [...D.Photos.values()].filter(x => ps.has(x.ProjectID));
  S.logsBy = {}; S.chkBy = {}; S.pk = new Map(); S.lk = new Map();
  S.projects.forEach(p => S.pk.set(p.ProjectID, [p.Name,p.Location,p.Contractor,p.Category,p.Scope,p.Owner].join(' ').toLowerCase()));
  S.logs.forEach(l => { (S.logsBy[l.ProjectID] = S.logsBy[l.ProjectID] || []).push(l);
    S.lk.set(l.LogID, [l.WorkCategory,l.Title,l.Content,l.Parties,l.Result,l.Source].join(' ').toLowerCase()); });
  S.checklist.forEach(i => (S.chkBy[i.ProjectID] = S.chkBy[i.ProjectID] || []).push(i));
}

function setSync(t){ $('#sync').textContent = t || ''; }
function sync(full){
  if (syncP) return syncP;
  setSync('同步中…');
  syncP = doSync(!!full, 0).finally(() => { syncP = null; setSync(''); });
  return syncP;
}
async function doSync(full, depth){
  const doFull = full || !sinceTs || Date.now() - lastFull > 864e5;   // 最少每 24 小時全量對一次（涵蓋直接喺 Sheets 改動）
  const m = mutSeq;
  const d = await api('bootstrap', doFull ? {} : {since:sinceTs});
  if (m !== mutSeq && depth < 2) return doSync(full, depth+1);       // 同步途中有本機寫入：重做，避免蓋過
  S.meta = {version:d.version, enums:d.enums};
  let changed = 0;
  for (const t in TBL) {
    const rows = d[TBL[t]] || [];
    if (d.full) { D[t] = new Map(); changed += 1; }
    changed += mergeRows(t, rows, d.full);
  }
  sinceTs = d.serverTime;
  if (d.full) lastFull = Date.now();
  if (changed) rebuild();
  saveCache();
  return changed;
}

// 寫入：用伺服器返回嘅記錄直接更新本機，唔使再重新載入
async function mut(action, table, payload){
  mutSeq++;
  try {
    const r = await api(action, Object.assign({table}, payload));
    if (action === 'delete') D[table].delete(payload.id);
    else if (r && r.record) mergeRows(table, [r.record], true);
    rebuild(); saveCache();
    return r;
  } finally { mutSeq++; }
}

  let tm;q.oninput=()=>{S.lf.q=q.value;clearTimeout(tm);tm=setTimeout(draw,150)};ty.onchange=()=>{S.lf.type=ty.value;draw()};pr.onchange=()=>{S.lf.project=pr.value;draw()};cat.onchange=()=>{S.lf.category=cat.value;draw()};
  const cats=WORK_CATEGORIES.map((c,i)=>el('button',{class:'category-tile',onclick:()=>newLog('',c)},el('span',{class:'category-icon'},['🏫','🏃','👥','📋'][i]),el('span',{},el('b',{},'新增'+c+'紀錄'),el('small',{},'快速建立工作紀錄'))));
  wrap.append(el('div',{class:'page-head'},el('div',{},el('h1',{},'工作紀錄'),el('p',{},'按工作範疇分類，記錄工作過程、處理結果及後續事項。')),el('div',{class:'head-actions'},el('button',{class:'btn',onclick:()=>newLog('')},'＋ 新增工作紀錄'))),el('div',{class:'grid'},cats),el('div',{class:'filterbar'},el('div',{class:'search'},q),cat,ty,pr),list);
  draw();return wrap;
}
/* ---------- 設定 ---------- */
function settingsView(){
  const out = el('div',{class:'mut'});
  return el('div',{},
    el('div',{class:'card'}, el('div',{},'後端版本：'+S.meta.version),
      el('div',{},'工程 '+S.projects.length+' 項 · 工作紀錄 '+S.logs.length+' 條 · 檢查項目 '+S.checklist.length+' 項'), out),
    el('div',{class:'row'},
      el('button',{class:'btn sec',onclick:async()=>{ out.textContent='測試中…'; try{ const r=await fetch(API_URL); const d=await r.json(); out.textContent='連線正常：'+d.version; }catch(e){ out.textContent='連線失敗：'+e.message; } }},'測試連線'),
      el('button',{class:'btn sec',onclick:()=>refresh('已重新載入')},'重新載入資料')),
    el('div',{class:'row'}, el('button',{class:'btn dan',onclick:async()=>{clearPw(); try{ await idb.clear(); }catch(e){} location.reload();}},'登出')));
}

/* ---------- 登入及啟動 ---------- */
function loginView(msg){
  $('#side').style.display = 'none';
  $('.body').style.marginLeft = '0';
  const pw = el('input',{type:'password',placeholder:'密碼',autocomplete:'current-password'});
  const rem = el('input',{type:'checkbox'});
  const go = () => { (rem.checked ? localStorage : sessionStorage).setItem('pw', pw.value); init(); };
  pw.onkeydown = ev => { if (ev.key === 'Enter') go(); };
  $('#main').replaceChildren(el('div',{class:'card'}, el('h3',{},'登入'),
    msg ? el('div',{style:'color:#b91c1c'},msg) : null, pw,
    el('label',{}, rem, ' 記住此裝置（共用電腦請勿選）'),
    el('div',{class:'row'}, el('button',{class:'btn',onclick:go},'登入'))));
}
function render(){
  $('#side').style.display='flex';
  $('.body').style.marginLeft = window.matchMedia('(max-width: 1000px)').matches ? '0' : '244px';
  document.querySelectorAll('#side nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(S.view==='project'?'projects':S.view)));
  $('#topTitle').textContent=VIEW_TITLE[S.view]||'工作紀錄';
  const v=S.view==='dashboard'?dashboardView():S.view==='project'?projectView():S.view==='logbook'?logbookView():S.view==='settings'?settingsView():projectsView();
  $('#main').replaceChildren(v);
}
document.querySelectorAll('#side nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.projectId=null;$('#side').classList.remove('open');$('#overlay').classList.remove('show');render();});
$('#burger').onclick=()=>{$('#side').classList.toggle('open');$('#overlay').classList.toggle('show');};
$('#overlay').onclick=()=>{$('#side').classList.remove('open');$('#overlay').classList.remove('show');};

async function init(){
  if (!getPw()) return loginView('');
  let hit = false;
  try { hit = await restoreCache(); } catch(e){}
  if (hit) { render(); bgSync(); return; }          // 有本機快取：即刻顯示，背景同步
  $('#main').replaceChildren(el('p',{class:'mut'},'載入中…'));
  try { await sync(true); render(); }                // 冇快取：一個請求載入全部
  catch(e){
    if (authFail(e)) return;
    $('#main').replaceChildren(el('div',{class:'card'}, el('div',{style:'color:#b91c1c'},'載入失敗：'+e.message),
      el('div',{class:'row'}, el('button',{class:'btn',onclick:init},'重試'))));
  }
}
init();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 註冊失敗', e)));
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#install').style.display = 'block'; });
$('#install').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $('#install').style.display = 'none'; };
window.addEventListener('appinstalled', () => { $('#install').style.display = 'none'; });
const syncOnline = () => { $('#offline').style.display = navigator.onLine ? 'none' : 'block'; };
window.addEventListener('online', () => { syncOnline(); if (S.meta) bgSync('已重新連線'); });
window.addEventListener('offline', syncOnline); syncOnline();
</script>
</body>
</html>
